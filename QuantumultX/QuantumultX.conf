# 使用说明：将 [server_remote] 中的「订阅链接填写处」替换为真实订阅链接。
[general]
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
network_check_url = http://wifi.vivo.com.cn/generate_204
fallback_udp_policy = reject
dns_reject_domain_behavior = nxdomain
dns_exclusion_list = *.lan, *.local, *.home.arpa, *.ntp.org, time.apple.com, time.asia.apple.com, time.windows.com, time.android.com, time.nist.gov, ntp.aliyun.com, ntp.tencent.com, ntp.ntsc.ac.cn, *.msftconnecttest.com, *.msftncsi.com, localhost.ptlogin2.qq.com, localhost.sec.qq.com, localhost.work.weixin.qq.com, *.stun.*, *.stun.playstation.net, *.xboxlive.com, *.playstation.net, *.xbox.com, xbox.ipv6.microsoft.com, *.srv.nintendo.net
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 169.254.0.0/16

[dns]
doh-server = https://223.5.5.5/dns-query, https://1.12.12.12/dns-query

[server_remote]
订阅链接填写处, tag=All, update-interval=86400, opt-parser=true, enabled=true

