# Stash 配置文件
mode: rule

# ------------------ 代理提供者 ------------------
proxy-providers:
  All:
    url: "你的真实订阅链接"
    interval: 86400
    path: ./all.yaml
    filter: '(?i)^(?!.*(流量|时间|重置|到期|过期|官网|网址|地址|客服|订阅|通知|群组|有效|本站|防止|Expire|Traffic|Reset|(^|[^A-Za-z0-9])(\d+(\.\d+)?\s*(GB|TB)|\d+\s*Days?)([^A-Za-z0-9]|$))).*$'

# ------------------ DNS ------------------
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  ipv6: true
  # 解析下面加密 DNS 服务器域名用，除 system 外必须是 IP。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 通用 nameserver 保持国内可直连的服务器
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 分域解析策略：
  # - 国内域名指回国内解析器，保留 CDN 就近调度准确性
  # - 私网域名直接走系统解析，不经代理 DNS
  # 注：Stash 不支持 rcode:// 形式的否定回答，广告域名只能在规则层 REJECT
  nameserver-policy:
    'rule-set:cn-domain':
      - 223.5.5.5
      - 119.29.29.29
    'rule-set:private-domain':
      - system
  # 代理服务器域名解析专用链路
  proxy-server-nameserver:
    - 223.5.5.5
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - '*.lan'
    - 'localhost'
    - '+.local'
    - '+.home.arpa'
    # 复用规则集覆盖手维护清单，防漏项
    - 'rule-set:cn-domain'
    - 'rule-set:private-domain'
    - '+.pool.ntp.org'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    - '+.ntp.org'
    - 'time.apple.com'
    - 'time.asia.apple.com'
    - 'time.windows.com'
    - 'time.android.com'
    - 'time.nist.gov'
    - 'ntp.aliyun.com'
    - 'ntp.tencent.com'
    - 'ntp.ntsc.ac.cn'
    # Windows 连通性检测
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    # QQ 快速登录检测
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'localhost.work.weixin.qq.com'
    - '+.stun.playstation.net'
    - '+.xboxlive.com'

# ------------------ 域名嗅探 ------------------
sniffer:
  enable: true
  force-dns-mapping: true
  # 纯 IP 流量从 SNI / Host 还原域名参与分流
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  # 对证书绑定 / 连接复用敏感，跳过嗅探
  skip-domain:
    - 'Mijia Cloud'
    - '+.apple.com'
    - '+.openai.com'
    - '+.oaistatic.com'
    - '+.oaiusercontent.com'
    - '+.chatgpt.com'

