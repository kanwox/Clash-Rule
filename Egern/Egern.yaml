      icon: https://cdn.jsdmirror.com/gh/Koolson/Qure@master/IconSet/Color/PayPal.png
  - select:
      name: Spotify
      policies: [主代理, HK, JP, SG, TW, US, 静态, DIRECT]
      icon: https://cdn.jsdmirror.com/gh/Koolson/Qure@master/IconSet/Color/Spotify.png
  - select:
      name: Steam
      policies: [主代理, HK, JP, SG, TW, US, 静态, DIRECT]
